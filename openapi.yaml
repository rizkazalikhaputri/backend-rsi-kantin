openapi: 3.0.3
info:
  title: API Sistem Review Kantin RSI
  version: 1.0.0
  description: |
    Tugas 3 Praktikum RSI: validasi (zod), format error seragam, autentikasi JWT, dan otorisasi per role.

    Cara memakai token: jalankan `POST /auth/login`, salin nilai `token`,
    klik tombol **Authorize** di kanan atas, lalu tempel tokennya (tanpa kata "Bearer").
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Stalls
  - name: Reviews

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun baru (role otomatis customer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Data user yang sedang login (semua role)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Data user (tanpa password)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stalls:
    get:
      tags: [Stalls]
      summary: Daftar warung (publik)
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: Cari di nama atau deskripsi }
        - { name: category, in: query, schema: { type: string, maxLength: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: Daftar warung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StallListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Stalls]
      summary: Tambah warung (owner, admin)
      description: "`owner_id` diambil dari token, bukan dari body."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallCreateRequest' }
      responses:
        '201':
          description: Warung dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StallResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stalls/{id}:
    parameters:
      - { $ref: '#/components/parameters/StallId' }
    get:
      tags: [Stalls]
      summary: Detail warung (publik)
      responses:
        '200':
          description: Detail warung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StallResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stalls]
      summary: Ubah warung (owner hanya miliknya, admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StallUpdateRequest' }
      responses:
        '200':
          description: Warung diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StallResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Stalls]
      summary: Hapus warung (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Warung dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: Warung berhasil dihapus }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stalls/{id}/reviews:
    parameters:
      - { $ref: '#/components/parameters/StallId' }
    post:
      tags: [Reviews]
      summary: Tambah review ke warung (semua role yang login)
      description: "`user_id` diambil dari token. Satu user hanya boleh mereview satu warung satu kali."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '201':
          description: Review dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: User sudah mereview warung ini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StallId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            status: fail
            message: Validasi gagal
            errors:
              - { field: name, message: name minimal 3 karakter }
              - { field: password, message: password minimal 8 karakter }
    Unauthorized:
      description: Belum login, token tidak ada, atau token tidak valid/kedaluwarsa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: fail, message: Token tidak ditemukan }
    Forbidden:
      description: Sudah login tetapi tidak punya akses (role atau kepemilikan tidak sesuai)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: fail, message: Anda tidak memiliki akses ke endpoint ini }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: fail, message: Warung tidak ditemukan }

  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: fail }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 3, maxLength: 100, example: Budi Santoso }
        email: { type: string, format: email, maxLength: 150, example: budi@mail.com }
        password: { type: string, minLength: 8, maxLength: 72, example: rahasia123 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@kantin.ac.id }
        password: { type: string, minLength: 1, example: Admin12345 }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, owner, customer] }
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data: { $ref: '#/components/schemas/User' }
    LoginResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data:
          type: object
          properties:
            token: { type: string }
            user: { $ref: '#/components/schemas/User' }
    Stall:
      type: object
      properties:
        id: { type: integer }
        owner_id: { type: integer }
        name: { type: string }
        category: { type: string, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
        avg_rating: { type: number }
        review_count: { type: integer }
        created_at: { type: string, format: date-time }
    StallCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 100, example: Warung Bu Siti }
        category: { type: string, maxLength: 50, example: Makanan Berat }
        location: { type: string, maxLength: 100, example: Kantin Lantai 1 }
        description: { type: string, maxLength: 1000, example: Nasi campur dan soto }
    StallUpdateRequest:
      type: object
      description: Semua field opsional, kirim hanya yang ingin diubah
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        category: { type: string, maxLength: 50 }
        location: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
    StallResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data: { $ref: '#/components/schemas/Stall' }
    StallListResponse:
      type: object
      properties:
        status: { type: string, example: success }
        page: { type: integer }
        limit: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/Stall' }
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, maxLength: 1000, example: Enak dan murah }
    ReviewResponse:
      type: object
      properties:
        status: { type: string, example: success }
        data:
          type: object
          properties:
            id: { type: integer }
            stall_id: { type: integer }
            user_id: { type: integer }
            rating: { type: integer }
            comment: { type: string, nullable: true }
